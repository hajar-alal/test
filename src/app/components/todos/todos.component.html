<section class="vh-100" style="background-color: #e2d5de;">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col col-xl-10">

        <div class="card shadow" style="border-radius: 15px;">
          <div class="card-body p-5">

            <!-- العنوان -->
            <h2 class="mb-5 text-center fw-bold text-primary">
              Todo List
            </h2>

            <!-- الفورم -->
            <form (ngSubmit)="createToDo()" class="mb-4">

              <!-- label -->
              <label class="form-label fw-semibold">
                Add new Task
              </label>

              <!-- input + button بنفس المستوى -->
              <div class="input-group input-group-lg">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Add new Task"
                  [(ngModel)]="newToDo.title"
                  name="title"
                />
                <button
                  type="submit"
                  class="btn btn-primary px-4"
                >
                  Add
                </button>
              </div>

            </form>

            <!-- قائمة المهام -->
            @for (todo of todos; track todo.id) {
              <ul class="list-group list-group-horizontal rounded-0 mb-2">

                <li class="list-group-item d-flex align-items-center ps-0 pe-3 py-1 border-0 bg-transparent">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      [(ngModel)]="todo.completed"
                    />
                  </div>
                </li>

                <li class="list-group-item px-3 py-1 d-flex align-items-center flex-grow-1 border-0 bg-transparent">
                  <p
                    class="lead fw-normal mb-0 bg-light w-100 ps-3 py-2 rounded"
                    [ngClass]="{'text-decoration-line-through': todo.completed}"
                    [routerLink]="['/todos', todo.id]"
                  >
                    {{ todo.title }}
                  </p>
                </li>

                <li class="list-group-item ps-3 pe-0 py-1 border-0 bg-transparent">
                  <a
                    class="text-danger"
                    title="Delete todo"
                    (click)="deleteToDo(todo.id)"
                  >
                    <i class="fa-solid fa-trash fs-5"></i>
                  </a>
                </li>

              </ul>
            }

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
